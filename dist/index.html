<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#b6dce9" />
  <meta name="description" content="Twenty-five little windows and one Christmas door in a lively snowy winter village." />
  <title>Devangshi's Winter Wonderland</title>
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="gift-modal.css" />
  <link rel="stylesheet" href="playlist.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Allura&family=Patrick+Hand&family=Caveat:wght@400;500&family=Kalam:wght@300;400;700&family=Cormorant+Garamond:wght@400;500;600;700&family=Roboto:wght@400;500;600;700&display=swap" />
</head>
<body>
  <main aria-label="A winter village advent calendar with twenty-five windows and a Christmas door">
    <div class="scene" id="scene">
      <svg class="landscape" id="landscape" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="Winter village surprises"></svg>
      <svg class="night-sky" id="night-sky" viewBox="0 0 1440 900" xmlns="http://www.w3.org/2000/svg" role="presentation"></svg>
      <svg class="fireworks" id="fireworks" viewBox="0 0 1440 900" xmlns="http://www.w3.org/2000/svg" role="presentation" aria-hidden="true"></svg>
      <div id="doors" class="doors" aria-label="Advent calendar"></div>
    </div>
    <canvas id="snow" aria-hidden="true"></canvas>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
